name: digest-weekly

on:
  schedule:
    - cron: "5 14 * * 0" # Sunday 20:05 Asia/Bishkek (UTC+6)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly digest
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          curl -sS -f -X POST "$PUBLIC_BASE_URL/api/internal/digest?type=weekly" \
            -H "Authorization: Bearer $INTERNAL_SECRET"
