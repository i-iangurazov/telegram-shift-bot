name: digest-daily

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        instance: [MAIN, COPY, DAILY]
    steps:
      - name: Run and verify actual result
        env:
          PUBLIC_BASE_URL: ${{ secrets[format('PUBLIC_BASE_URL_{0}', matrix.instance)] }}
          INTERNAL_SECRET: ${{ secrets[format('INTERNAL_SECRET_{0}', matrix.instance)] }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_BASE_URL"
          test -n "$INTERNAL_SECRET"
          response=$(curl --fail-with-body --silent --show-error --max-time 65 -X POST "${PUBLIC_BASE_URL%/}/api/internal/digest?type=daily" \
            -H "Authorization: Bearer $INTERNAL_SECRET")
          echo "$response" | jq '{ok, mode, skipped, error, queue, autoClosed, ranAt, db}'
          echo "$response" | jq -e '.ok == true and (.error != true) and (.skipped != true) and ((.queue.failed // 0) == 0) and ((.queue.retried // 0) == 0)'
