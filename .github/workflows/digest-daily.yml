name: digest-daily

on:
  schedule:
    - cron: "0 14 * * *" # 20:00 Asia/Bishkek (UTC+6)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily digest
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          curl -sS -f -X POST "$PUBLIC_BASE_URL/api/internal/digest?type=daily" \
            -H "Authorization: Bearer $INTERNAL_SECRET"
